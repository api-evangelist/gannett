  state: none
  reason: no-developer-program
  detail: >-
    Gannett runs no developer program at all — developer.gannett.com 301s to the
    www.usatodayco.com corporate homepage and developer.usatoday.com 301s to the
    www.usatoday.com consumer news site, api.usatoday.com returns 404, and /openapi.json,
    /swagger.json, /api-docs and /.well-known/agent-card.json miss on every Gannett, USA
    TODAY and LocaliQ host; the only machine-readable documents it serves are a security.txt,
    a Global Privacy Control signal and a WordPress-generated llms.txt on the LocaliQ blog.
