description: >-
  Gannett Co., Inc. is a diversified media and digital marketing solutions company and the
  publisher of USA TODAY and a network of more than 200 local daily newspapers across the
  United States. It now presents its corporate identity as USA TODAY Co. — www.gannett.com
  301-redirects its corporate pages to www.usatodayco.com, and investors.gannett.com resolves
  to investors.usatodayco.com. Through the USA TODAY Network and LocaliQ, its digital
  marketing services arm for small and medium-sized businesses, Gannett delivers news,
  audience and advertising technology. Gannett publishes no developer portal, no API
  reference and no machine-readable API contract: developer.gannett.com and
  developer.usatoday.com both redirect to consumer sites, and no OpenAPI, AsyncAPI, GraphQL,
  MCP or A2A surface is served on any of its hosts. What it does publish machine-readably is
  a publisher-side control surface — an RFC 9116 security.txt, a Global Privacy Control
  signal, an llms.txt on localiq.com, and a 958-line robots.txt that denies the major AI
  crawlers site-wide while re-allowing a commercial subset of shopping, money and
  sponsor-content paths.
